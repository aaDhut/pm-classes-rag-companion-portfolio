[project]
name = "pm-classes-rag-companion"
version = "0.1.0"
description = "Multimodal RAG study companion for a product-management course (Drive → Vertex AI → Qdrant → Gemini)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastembed>=0.8.1",
    "google-api-python-client>=2.200.0",
    "google-auth-oauthlib>=1.4.1",
    "google-cloud-storage>=2.19.0",
    "google-cloud-vision>=3.15.0",
    "google-genai>=2.25.0",
    "lameenc>=1.9.0",
    "openpyxl>=3.1.5",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-pptx>=1.0.2",
    "qdrant-client>=1.19.1",
    "streamlit>=1.64.0",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "imageio-ffmpeg>=0.6.0",
]
